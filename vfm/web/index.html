<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Both schemes are declared so the browser paints a matching background
      before the bundle executes. The usual trick — an inline script that
      applies the stored theme — is impossible here: the control plane serves a
      CSP with `script-src 'self'` and no inline scripts (PLAN.md §12.1).
    -->
    <meta name="color-scheme" content="light dark" />

    <!--
      PRODUCT_NAME in @vfm/shared is the authoritative product name (PLAN.md
      §0); HTML cannot import it, so the shell sets document.title from the
      constant on mount and this value only covers the first paint.
    -->
    <title>Velero Fleet Manager</title>

    <!-- Local asset. No favicon request may leave this origin (PLAN.md §1.1 P6). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
