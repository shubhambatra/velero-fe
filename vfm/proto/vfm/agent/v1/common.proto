syntax = "proto3";

package vfm.agent.v1;

// Shared building blocks. Field names mirror the pinned Velero v1.18.4 / k8s
// types (PLAN.md §0 rule 4) so the mapping to the Go structs stays reviewable.

// metav1.LabelSelector.
message LabelSelector {
  map<string, string> match_labels = 1;
  repeated LabelSelectorRequirement match_expressions = 2;
}

// metav1.LabelSelectorRequirement.
message LabelSelectorRequirement {
  string key = 1;
  // In, NotIn, Exists, DoesNotExist.
  string operator = 2;
  repeated string values = 3;
}

// corev1.TypedLocalObjectReference (resourcePolicy, resourceModifier).
message TypedLocalObjectReference {
  string api_group = 1;
  string kind = 2;
  string name = 3;
}

// corev1.SecretKeySelector: a reference, never the secret value.
message SecretKeyRef {
  string name = 1;
  string key = 2;
}

// A credential the control plane asks the agent to write into a Secret so a
// BSL/VSL can reference it. The only place secret material crosses the wire.
// Both ends must keep `content` out of logs and error messages (PLAN.md §11).
message CredentialSecret {
  SecretKeyRef ref = 1;
  bytes content = 2;
}

// PLAN.md §5.4.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_FORBIDDEN_BY_AGENT_POLICY = 4;
  ERROR_CODE_UNSUPPORTED_BY_VELERO_VERSION = 5;
  ERROR_CODE_KUBE_API_ERROR = 6;
  ERROR_CODE_TIMEOUT = 7;
  ERROR_CODE_INTERNAL = 8;
}
