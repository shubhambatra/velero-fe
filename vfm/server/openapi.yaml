info:
  title: Velero Fleet Manager API
  description: Control-plane REST API. Errors use RFC 9457 application/problem+json and every response
    carries an X-Request-Id header.
  version: v1
  contact: {}
tags: []
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vfm_session
    apiToken:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas: {}
