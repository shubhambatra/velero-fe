openapi: 3.1.0
paths:
  /auth/setup:
    get:
      description: True only while no user exists. The SPA uses this to decide between the login form and
        the setup form.
      operationId: AuthController_setupStatus
      parameters: []
      responses:
        "200":
          description: ""
      summary: Whether first-time setup is still available
      tags:
        - auth
    post:
      description: Consumes the one-time token printed to the logs on first start. Closes permanently once
        a user exists; there is no open self-signup.
      operationId: AuthController_createFirstAdmin
      parameters: []
      responses:
        "201":
          description: The administrator was created and is signed in.
        "401":
          description: The token is missing, wrong, expired or already used.
        "422":
          description: The password does not meet the policy.
      summary: Create the first platform administrator
      tags:
        - auth
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      responses:
        "200":
          description: Signed in; a session cookie is set.
        "401":
          description: Invalid credentials.
        "429":
          description: Too many attempts. Retry-After gives the wait in seconds.
      summary: Sign in with email and password
      tags:
        - auth
  /auth/sudo:
    post:
      description: PLAN.md §8.3 requires re-authentication within the last 5 minutes for restore create,
        any delete, storage write, cluster delete and role-binding changes. Accepts the account
        password or a second factor.
      operationId: AuthController_sudo
      parameters: []
      responses:
        "200":
          description: The sudo window is open.
        "401":
          description: The password or code did not verify.
      summary: Re-authenticate to open the sudo window
      tags:
        - auth
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        "204":
          description: ""
      summary: Sign out of the current session
      tags:
        - auth
  /auth/sessions:
    delete:
      description: Revokes every other session for the current user, keeping this one. PLAN.md §8.3.
      operationId: AuthController_signOutEverywhere
      parameters: []
      responses:
        "200":
          description: ""
      summary: Sign out everywhere
      tags:
        - auth
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        "200":
          description: ""
      summary: The currently authenticated user
      tags:
        - auth
  /auth/mfa:
    get:
      description: Reports whether MFA is on, whether an enrolment is half-finished, how many recovery
        codes remain, and whether the user is obliged to have MFA at all.
      operationId: MfaController_status
      parameters: []
      responses:
        "200":
          description: ""
      summary: Multi-factor authentication status for the current user
      tags:
        - auth
    delete:
      description: Requires a currently valid second factor as well as recent re-authentication. Destroys
        the stored secret and every recovery code.
      operationId: MfaController_disable
      parameters: []
      responses:
        "204":
          description: MFA disabled.
        "401":
          description: The code did not verify.
        "403":
          description: Recent re-authentication required, or MFA is obliged.
      summary: Disable multi-factor authentication
      tags:
        - auth
  /auth/mfa/enrol:
    post:
      description: "Generates a shared secret and returns it with an otpauth:// URI for a QR code. MFA is
        not yet active: it is turned on only once a code from this secret has been verified, so an
        unscanned QR cannot lock the account out."
      operationId: MfaController_beginEnrolment
      parameters: []
      responses:
        "200":
          description: ""
      summary: Begin TOTP enrolment
      tags:
        - auth
  /auth/mfa/enrol/confirm:
    post:
      description: Verifies a code from the pending secret, turns MFA on, and returns ten single-use
        recovery codes. The codes are shown exactly once and stored only as hashes.
      operationId: MfaController_confirmEnrolment
      parameters: []
      responses:
        "200":
          description: MFA enabled; recovery codes returned once.
        "401":
          description: The code did not verify.
      summary: Confirm TOTP enrolment and receive recovery codes
      tags:
        - auth
  /auth/mfa/challenge:
    post:
      description: Accepts either a six-digit TOTP code or a recovery code. On success the session becomes
        fully authenticated and its id is rotated.
      operationId: MfaController_challenge
      parameters: []
      responses:
        "200":
          description: The factor was accepted.
        "401":
          description: The code did not verify.
      summary: Answer the second-factor challenge for the current session
      tags:
        - auth
  /auth/mfa/recovery-codes:
    post:
      description: Issues ten new single-use codes and invalidates the previous set. Shown once. Requires
        recent re-authentication.
      operationId: MfaController_regenerateRecoveryCodes
      parameters: []
      responses:
        "200":
          description: ""
      summary: Replace the recovery codes
      tags:
        - auth
  /me/orgs:
    get:
      operationId: OrgsController_myOrgs
      parameters: []
      responses:
        "200":
          description: ""
      summary: Organizations the caller belongs to (org switcher)
      tags:
        - orgs
  /me/active-org:
    post:
      operationId: OrgsController_setActive
      parameters: []
      responses:
        "204":
          description: ""
      summary: Switch the active organization
      tags:
        - orgs
  /orgs:
    post:
      description: "Platform administrators only. PLAN.md §8.1: the platform admin bootstraps orgs; there
        is no open org creation. The creator becomes the first Owner."
      operationId: OrgsController_create
      parameters: []
      responses:
        "201":
          description: ""
      summary: Create an organization
      tags:
        - orgs
  /orgs/{orgId}:
    get:
      operationId: OrgsController_get
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Organization details and settings
      tags:
        - orgs
    patch:
      operationId: OrgsController_update
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Update the name or MFA policy (Owner/Admin)
      tags:
        - orgs
  /orgs/{orgId}/members:
    get:
      operationId: OrgsController_members
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Members of the organization
      tags:
        - orgs
  /orgs/{orgId}/members/{userId}:
    patch:
      operationId: OrgsController_changeRole
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Change a member’s org role (Owner/Admin)
      tags:
        - orgs
    delete:
      operationId: OrgsController_remove
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Remove a member, or leave (sudo required)
      tags:
        - orgs
  /orgs/{orgId}/invites:
    post:
      description: Responds 503 if SMTP is not configured; no invitation is stored in that case.
      operationId: InvitesController_create
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: Invite someone by email (Owner/Admin)
      tags:
        - invites
    get:
      operationId: InvitesController_list
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Pending invitations (Owner/Admin)
      tags:
        - invites
  /orgs/{orgId}/invites/{inviteId}:
    delete:
      operationId: InvitesController_revoke
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: inviteId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Revoke an invitation (Owner/Admin, sudo required)
      tags:
        - invites
  /invites/accept:
    post:
      description: The signed-in account must hold the invited address. Single use. Responds with the same
        400 for an unknown, expired, used or foreign token.
      operationId: InvitesController_accept
      parameters: []
      responses:
        "201":
          description: ""
      summary: Accept an invitation with an existing account
      tags:
        - invites
  /invites/register:
    post:
      description: The only user-creation path after first-time setup. Requires a valid token for an
        address that has no account.
      operationId: InvitesController_register
      parameters: []
      responses:
        "201":
          description: ""
      summary: Accept an invitation by creating an account
      tags:
        - invites
  /orgs/{orgId}/teams:
    get:
      operationId: TeamsController_list
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: List teams
      tags:
        - teams
    post:
      operationId: TeamsController_create
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: Create a team (Owner/Admin)
      tags:
        - teams
  /orgs/{orgId}/teams/{teamId}:
    patch:
      operationId: TeamsController_update
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: teamId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Rename or describe a team (Owner/Admin)
      tags:
        - teams
    delete:
      operationId: TeamsController_remove
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: teamId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Delete a team (Owner/Admin, sudo required)
      tags:
        - teams
  /orgs/{orgId}/teams/{teamId}/members:
    get:
      operationId: TeamsController_members
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: teamId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Members of a team
      tags:
        - teams
  /orgs/{orgId}/teams/{teamId}/members/{userId}:
    put:
      operationId: TeamsController_addMember
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: teamId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Add an org member to a team (Owner/Admin)
      tags:
        - teams
    delete:
      operationId: TeamsController_removeMember
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: teamId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      summary: Remove a member from a team (Owner/Admin)
      tags:
        - teams
  /healthz:
    get:
      description: Returns 200 while the process is able to serve requests.
      operationId: HealthController_liveness
      parameters: []
      responses:
        "200":
          description: The process is alive.
      summary: Liveness probe
      tags:
        - health
  /readyz:
    get:
      description: Reports whether PostgreSQL and Redis are reachable. Returns 503 when any dependency is down.
      operationId: HealthController_readiness
      parameters: []
      responses:
        "200":
          description: All dependencies are reachable.
        "503":
          description: At least one dependency is unreachable.
      summary: Readiness probe
      tags:
        - health
info:
  title: Velero Fleet Manager API
  description: Control-plane REST API. Errors use RFC 9457 application/problem+json and every response
    carries an X-Request-Id header.
  version: v1
  contact: {}
tags: []
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vfm_session
    apiToken:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas: {}
