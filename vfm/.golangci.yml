version: '2'

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    gosec:
      # The agent handles certs, tokens and pod logs; keep every rule on and
      # justify exceptions inline with #nosec and a reason (PLAN.md §12.1).
      severity: low
      confidence: low
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
