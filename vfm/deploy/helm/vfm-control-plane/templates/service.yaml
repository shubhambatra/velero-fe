apiVersion: v1
kind: Service
metadata:
  name: {{ include "vfm-cp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vfm-cp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vfm-cp.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
---
# The agent gateway: its own Service so it can be exposed (LoadBalancer, NodePort, TLS passthrough)
# without exposing the UI/API.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vfm-cp.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vfm-cp.labels" . | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  {{- if eq .Values.gateway.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- with .Values.gateway.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "vfm-cp.selectorLabels" . | nindent 4 }}
  ports:
    - { name: grpc, port: {{ .Values.gateway.service.port }}, targetPort: grpc, protocol: TCP }
{{- if .Values.metrics.service.enabled }}
---
# Metrics are never on the public Service or Ingress (PLAN 10).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vfm-cp.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vfm-cp.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "vfm-cp.selectorLabels" . | nindent 4 }}
  ports:
    - { name: metrics, port: 9090, targetPort: metrics, protocol: TCP }
{{- end }}
