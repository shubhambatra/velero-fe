apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vfm-cp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vfm-cp.labels" . | nindent 4 }}
# The control plane never talks to the Kubernetes API (principle P1: it holds no cluster credentials).
automountServiceAccountToken: false
