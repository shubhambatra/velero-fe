{{- if .Values.migrations.enabled }}
{{- $secret := required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vfm-cp.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vfm-cp.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # Before any new pod of this release exists, on first install and on every upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "vfm-cp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "vfm-cp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $secret | quote }}, key: {{ .Values.secrets.keys.databaseUrl | quote }} } }
            # Prisma writes engine files and its own cache here.
            - { name: HOME, value: /tmp }
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
{{- end }}
