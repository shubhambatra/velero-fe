{{- if and .Values.enrollment.token (not .Values.enrollment.existingSecret) }}
# The one-time bootstrap token. Remove it after the agent has enrolled.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vfm-agent.name" . }}-enrollment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vfm-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollment.token | quote }}
{{- end }}
