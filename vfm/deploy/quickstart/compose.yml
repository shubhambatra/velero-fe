# Try the Velero Fleet Manager on one machine with Docker. NOT for production (see docs/OPERATIONS.md):
# development mode (cookies not marked Secure so plain http://localhost works), throwaway passwords,
# one replica.
#
#   docker compose -f deploy/quickstart/compose.yml up -d --build   # builds the image on first run (a few minutes)
#   docker compose -f deploy/quickstart/compose.yml logs control-plane | grep -A8 "no users yet"   # the setup token
#   open http://localhost:3000
#
# Every service joins the Docker network `kube.dev-backup.in`; the control plane is also reachable on it under that name
# (open http://kube.dev-backup.in once the name resolves to this machine, see RUN.md). http://localhost:3000 keeps working.
#
# `--build` builds the control-plane image (API, gateway and web UI) from this checkout; run it from the vfm/ directory.
name: vfm-quickstart
networks:
  kube:
    name: kube.dev-backup.in
services:
  postgres:
    image: postgres:16.15-alpine
    networks: [kube]
    environment:
      POSTGRES_USER: vfm
      POSTGRES_PASSWORD: quickstart-only
      POSTGRES_DB: vfm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vfm -d vfm']
      interval: 3s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:7.2.14-alpine
    networks: [kube]
    command: ['valkey-server', '--requirepass', 'quickstart-only']
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a quickstart-only ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    networks: [kube]
    build: { context: ../.., dockerfile: server/Dockerfile }
    image: ghcr.io/shubhambatra/vfm-control-plane:0.1.0
    working_dir: /app
    entrypoint: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://vfm:quickstart-only@postgres:5432/vfm
      HOME: /tmp
    depends_on:
      postgres: { condition: service_healthy }
  control-plane:
    networks:
      kube:
        aliases: [kube.dev-backup.in]
    build: { context: ../.., dockerfile: server/Dockerfile }
    image: ghcr.io/shubhambatra/vfm-control-plane:0.1.0
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://vfm:quickstart-only@postgres:5432/vfm
      REDIS_URL: redis://:quickstart-only@valkey:6379
      # A throwaway key. Generate your own for anything real: openssl rand -base64 32
      VFM_MASTER_KEY: cXVpY2tzdGFydC1vbmx5LWRvLW5vdC11c2UtaXQhISE=
      PUBLIC_URL: http://kube.dev-backup.in
      API_PUBLIC_URL: http://kube.dev-backup.in
      GATEWAY_PUBLIC_ADDRESS: kube.dev-backup.in:8443
      GATEWAY_HOSTNAMES: kube.dev-backup.in,localhost,127.0.0.1,control-plane
    ports:
      - '127.0.0.1:80:3000' # the UI and the API as http://kube.dev-backup.in/
      - '127.0.0.1:3000:3000' # the same, as http://localhost:3000
      - '127.0.0.1:8443:8443' # the agent gateway (mTLS)
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    user: '65532:65532'
volumes:
  pgdata: {}
