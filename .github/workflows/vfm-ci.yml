name: VFM CI

# Velero Fleet Manager lives in the vfm/ subtree alongside the legacy
# application (see vfm/docs/DECISIONS.md ADR-003). This workflow is
# path-filtered so legacy-only commits are unaffected, and vice versa.

on:
  push:
    branches: ['main', 'vfm/**']
    paths:
      - 'vfm/**'
      - '.github/workflows/vfm-ci.yml'
  pull_request:
    paths:
      - 'vfm/**'
      - '.github/workflows/vfm-ci.yml'
  workflow_dispatch:

concurrency:
  group: vfm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: vfm

env:
  # Pinned in vfm/docs/DECISIONS.md ADR-002 and ADR-004.
  GO_VERSION: '1.27.2'
  NODE_VERSION: '22'

jobs:
  typescript:
    name: TypeScript lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm comes from the packageManager field via corepack (ADR-004), so the
      # repository-root npm/Nx workspace is never involved.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

  go:
    name: Go lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check whether the agent module exists yet
        id: agent
        run: |
          if [ -f agent/go.mod ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'agent module not present yet (M0 day 3) — skipping' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-go@v6
        if: steps.agent.outputs.present == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: vfm/agent/go.sum

      - name: Build
        if: steps.agent.outputs.present == 'true'
        working-directory: vfm/agent
        run: go build ./...

      - name: Vet
        if: steps.agent.outputs.present == 'true'
        working-directory: vfm/agent
        run: go vet ./...

      - name: Unit tests
        if: steps.agent.outputs.present == 'true'
        working-directory: vfm/agent
        run: go test -race ./...

      - name: golangci-lint
        if: steps.agent.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          working-directory: vfm/agent

  proto:
    name: Proto lint and breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether any proto definitions exist yet
        id: proto
        run: |
          if compgen -G 'proto/vfm/agent/v1/*.proto' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'no .proto files yet (M2 day 10) — skipping buf' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      # PLAN.md §5.7: buf lint plus a breaking-change check against main.
      - uses: bufbuild/buf-action@v1
        if: steps.proto.outputs.present == 'true'
        with:
          input: vfm/proto
          breaking_against: 'https://github.com/${{ github.repository }}.git#branch=main,subdir=vfm/proto'
          pr_comment: false

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # PLAN.md §12.1: fail on high/critical. Applies from day 1, not in a
    # later hardening phase.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high

      - name: Check whether the agent module exists yet
        id: agent
        run: |
          if [ -f agent/go.mod ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.agent.outputs.present == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: vfm/agent/go.sum

      - name: govulncheck
        if: steps.agent.outputs.present == 'true'
        working-directory: vfm/agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Image scanning is added alongside the first Dockerfile (agent image,
      # M2 day 15). Until then Trivy scans the source tree for vulnerable
      # dependencies and misconfigured manifests.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: vfm
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
