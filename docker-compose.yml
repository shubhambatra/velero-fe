# `docker compose up -d --build` starts the Velero Fleet Manager (fleet UI at http://localhost:3000).
# First visit shows Setup; the one-time token is in the control-plane log:
#   docker compose logs control-plane | grep -A8 "no users yet"
# The original single-cluster Velero UI is kept in docker-compose.legacy.yml:
#   docker compose -f docker-compose.legacy.yml [-f docker-compose.legacy.override.yml] up -d
include:
  - path: vfm/deploy/quickstart/compose.yml
